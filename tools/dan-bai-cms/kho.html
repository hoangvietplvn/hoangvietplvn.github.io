<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Kho ảnh</title>
<link rel="stylesheet" href="app.css">
<style>
  body.kho { background: #f6f5f2; }
  .kho main { padding: 16px; }
  .kho .item { display: flex; gap: 12px; align-items: center; padding: 10px 0; border-bottom: 1px solid #ddd; }
  .kho .item img { width: 72px; height: 72px; object-fit: cover; border-radius: 6px; background: #eee; }
  .kho .item .meta { flex: 1; min-width: 0; font-size: 13px; color: #555; word-break: break-all; }
  .kho .item .meta b { color: #222; font-size: 14px; }
  .kho .btn { display: inline-block; padding: 9px 14px; border-radius: 6px; background: #a61b1b; color: #fff; font-weight: 600; }
  .kho .row { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; margin: 12px 0; }
</style>
</head>
<body class="kho">
<main>
  <h1>Kho ảnh</h1>
  <p class="hint">Ảnh của bài được tự tải vào đây khi bạn lấy bài. Khi điền CMS, ứng dụng lấy ảnh từ kho để tải lên.</p>
  <div class="row">
    <label class="btn">Thêm ảnh từ điện thoại
      <input id="pick" type="file" accept="image/*" multiple hidden>
    </label>
    <button id="clear" type="button">Xóa tất cả</button>
  </div>
  <p id="sum" class="hint"></p>
  <p id="msg" class="status" role="status"></p>
  <div id="list"></div>
</main>
<script src="shim.js"></script>
<script src="imgtools.js"></script>
<script src="kho.js"></script>
</body>
</html>
