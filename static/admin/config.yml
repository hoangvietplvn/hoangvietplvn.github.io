# Cấu hình trang quản trị (Sveltia CMS). Mỗi lần bấm Lưu trong trang quản trị,
# nội dung được ghi thẳng vào kho GitHub và blog tự đăng lại sau khoảng nửa phút.
backend:
  name: github
  repo: hoangvietplvn/hoangvietplvn.github.io
  branch: main
  auth_methods: [token]

app_title: Quản trị blog
site_url: https://hoangvietplvn.github.io
media_folder: static/images/uploads
public_folder: /images/uploads

slug:
  encoding: ascii
  clean_accents: true

collections:
  - name: home
    label: Trang nhất
    description: Chọn những bài hiện ra trang nhất. Bài không được chọn vẫn nằm trong chuyên mục và trang Lưu trữ.
    icon: home
    files:
      - name: homepage
        label: Bài trên trang nhất
        file: homepage.json
        fields:
          - name: show_blog
            label: Hiện phần blog cá nhân trên trang nhất
            widget: boolean
            default: true
            required: false
            hint: Tắt thì trang nhất chỉ còn khu Tin nổi bật; các bài viết vẫn mở được qua đường dẫn riêng, trang Lưu trữ và chuyên mục.
          - name: mode
            label: Cách chọn bài
            widget: select
            default: auto
            hint: Ở chế độ "Tự chọn", trang nhất chỉ hiện đúng các bài chọn bên dưới, theo đúng thứ tự sắp xếp.
            options:
              - { label: "Tự động — bài mới nhất lên đầu", value: auto }
              - { label: "Tự chọn — chỉ hiện các bài chọn bên dưới", value: manual }
          - name: lead
            label: Bài chính (ảnh lớn đầu trang)
            widget: select
            required: false
            hint: Bài vừa đăng sẽ có trong danh sách sau khoảng một phút; tải lại trang quản trị nếu chưa thấy.
            options: __POST_OPTIONS__
          - name: side
            label: Cột bên phải
            label_singular: bài
            widget: list
            required: false
            hint: Nên chọn 2 đến 4 bài. Kéo thả để đổi thứ tự.
            field: { name: post, label: Bài viết, widget: select, options: __POST_OPTIONS__ }
          - { name: side_label, label: Tên cột bên phải, widget: string, default: Đáng đọc, required: false }
          - name: more
            label: Lưới bài phía dưới
            label_singular: bài
            widget: list
            required: false
            hint: Mỗi hàng ba bài. Kéo thả để đổi thứ tự.
            field: { name: post, label: Bài viết, widget: select, options: __POST_OPTIONS__ }
          - { name: more_label, label: Tên lưới bài phía dưới, widget: string, default: Mới đăng, required: false }

  - name: posts
    label: Bài viết
    label_singular: Bài viết
    description: Các bài viết trên blog. Bật "Bản nháp" để lưu mà chưa đăng.
    icon: article
    folder: posts
    extension: md
    format: frontmatter
    create: true
    delete: true
    slug: "{{year}}-{{month}}-{{day}}-{{slug}}"
    summary: "{{title}}"
    sortable_fields: [date, title]
    fields:
      - { name: title, label: Tiêu đề, widget: string }
      - { name: date, label: Ngày đăng, widget: datetime, type: date, format: YYYY-MM-DD }
      - name: category
        label: Chuyên mục
        widget: relation
        collection: categories
        value_field: "{{slug}}"
        display_fields: [name]
        search_fields: [name]
      - { name: excerpt, label: Sapo (tóm tắt), widget: text, hint: Một hai câu hiện dưới tiêu đề và ngoài trang nhất. }
      - { name: author, label: Tác giả, widget: string, required: false, hint: Bỏ trống để dùng tên tác giả mặc định của trang. }
      - { name: cover, label: Ảnh bìa, widget: image, required: false, hint: Bỏ trống thì trang tự vẽ một ảnh bìa trừu tượng. }
      - { name: cover_caption, label: Chú thích ảnh bìa, widget: string, required: false }
      - name: layout
        label: Kiểu trình bày
        widget: select
        default: article
        options:
          - { label: Bài thường, value: article }
          - { label: Long-form (ảnh bìa tràn màn hình), value: longform }
      - { name: draft, label: Bản nháp (chưa đăng), widget: boolean, default: false, required: false }
      - { name: body, label: Nội dung, widget: markdown }

  - name: categories
    label: Chuyên mục
    label_singular: Chuyên mục
    description: Các chuyên mục trên thanh điều hướng. "Thứ tự" nhỏ hơn thì đứng trước.
    icon: category
    folder: categories
    extension: json
    format: json
    create: true
    delete: true
    identifier_field: name
    slug: "{{name}}"
    summary: "{{name}}"
    sortable_fields: [order, name]
    fields:
      - { name: name, label: Tên chuyên mục, widget: string }
      - { name: order, label: Thứ tự, widget: number, value_type: int, default: 10 }
      - { name: description, label: Mô tả, widget: string, required: false }

  - name: pages
    label: Trang tĩnh
    label_singular: Trang
    description: Các trang như Giới thiệu.
    icon: description
    folder: pages
    extension: md
    format: frontmatter
    create: true
    delete: true
    slug: "{{slug}}"
    fields:
      - { name: title, label: Tiêu đề, widget: string }
      - { name: excerpt, label: Mô tả ngắn, widget: text, required: false }
      - { name: body, label: Nội dung, widget: markdown }

  - name: settings
    label: Cài đặt trang
    icon: settings
    files:
      - name: site
        label: Thông tin chung
        file: site.config.json
        fields:
          - { name: title, label: Tên blog, widget: string }
          - { name: tagline, label: Khẩu hiệu, widget: string }
          - { name: author, label: Tác giả mặc định, widget: string }
          - { name: description, label: Mô tả trang, widget: text }
          - { name: established, label: Năm bắt đầu, widget: string }
          - { name: url, label: Địa chỉ trang, widget: string, hint: "Ví dụ https://hoangvietplvn.github.io" }
          - { name: domain, label: Tên miền riêng, widget: string, required: false, hint: Chỉ điền khi đã mua tên miền riêng. }
          - { name: language, label: Mã ngôn ngữ, widget: string, default: vi }
      - name: news
        label: Thanh điểm tin đầu trang
        file: news.config.json
        fields:
          - { name: enabled, label: Hiện thanh điểm tin, widget: boolean, default: true, required: false }
          - { name: label, label: Nhãn, widget: string, default: Tin nóng }
          - { name: per_category, label: Số tin mỗi mục, widget: number, value_type: int, min: 1, max: 20, default: 8 }
          - name: categories
            label: Các mục tin
            label_singular: mục
            widget: list
            summary: "{{name}}"
            fields:
              - { name: name, label: Tên mục, widget: string }
              - name: feeds
                label: Nguồn tin (RSS)
                label_singular: nguồn
                widget: list
                summary: "{{source}}"
                fields:
                  - { name: source, label: Tên báo, widget: string }
                  - { name: url, label: Địa chỉ RSS, widget: string, hint: "Phải bắt đầu bằng https://" }
          - name: fake
            label: Mục Cảnh báo tin giả
            widget: object
            collapsed: true
            fields:
              - { name: enabled, label: Hiện mục Cảnh báo tin giả, widget: boolean, default: true, required: false }
              - { name: label, label: Tên nút, widget: string, default: Cảnh báo tin giả }
              - name: feeds
                label: Nguồn quét
                label_singular: nguồn
                widget: list
                summary: "{{source}}"
                hint: Nguồn đánh dấu "chính thức" được lấy toàn bộ; các nguồn khác chỉ giữ bài nói về tin giả, thông tin sai sự thật, giả mạo có cơ quan chức năng lên tiếng.
                fields:
                  - { name: source, label: Tên nguồn, widget: string }
                  - { name: url, label: Địa chỉ RSS hoặc trang chuyên mục, widget: string, hint: "Phải bắt đầu bằng https://" }
                  - { name: official, label: Nguồn chính thức (lấy toàn bộ), widget: boolean, default: false, required: false }
